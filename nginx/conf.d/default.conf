server {
    listen 80;
    server_name localhost;

    # API routes - must come before frontend location
    # Auth routes - proxy /api/auth/* to /auth/* on aub-service.
    # Throttled: OTP verification caps at 5 attempts per code, but re-issuing a
    # code resets that counter, so an unthrottled login/verify loop is unbounded
    # guessing against a 6-digit secret. 1 r/s (burst 10) leaves real sign-ins
    # unaffected while making brute force infeasible.
    location /api/auth {
        limit_req zone=public_write burst=10 nodelay;
        limit_conn perip 20;
        proxy_pass $AUB_SERVICE_URL/auth;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Plans routes - proxy /api/plans/* to /plans/* on aub-service
    location /api/plans {
        proxy_pass $AUB_SERVICE_URL/plans;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Service-to-service order endpoints (reconciliation, manual provisioning).
    # They authenticate with INTERNAL_API_SECRET, but defence in depth: nothing
    # under /orders/internal or /orders/webhook should be reachable from the
    # internet at all. Must precede the generic /api/orders block below.
    location ~ ^/api/orders/(internal|webhook)(/|$) {
        deny all;
    }

    # Orders routes - proxy /api/orders/* to /orders/* on aub-service
    location /api/orders {
        proxy_pass $AUB_SERVICE_URL/orders;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Entitlement redemption (authenticated; creates an event). Throttled - it
    # is the deferred-redeem surface for venue/beta/promo links.
    location /api/redeem {
        limit_req zone=public_write burst=10 nodelay;
        proxy_pass $CORE_SERVICE_URL/redeem;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Core-service API routing
    location /api/events {
        proxy_pass $CORE_SERVICE_URL/events;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # AI event assistant (core-service) - LLM chat, event-scoped
    location /api/assistant {
        proxy_pass $CORE_SERVICE_URL/assistant;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
        proxy_read_timeout 300s;
    }

    # Venue Edition (B2B2C) dashboard + admin provisioning (core-service)
    location /api/venues {
        proxy_pass $CORE_SERVICE_URL/venues;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/venues {
        proxy_pass $CORE_SERVICE_URL/admin/venues;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/events {
        proxy_pass $CORE_SERVICE_URL/admin/events;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/stats {
        proxy_pass $CORE_SERVICE_URL/admin/stats;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/audit-log {
        proxy_pass $CORE_SERVICE_URL/admin/audit-log;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/health {
        proxy_pass $CORE_SERVICE_URL/admin/health;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/feature-flags {
        proxy_pass $CORE_SERVICE_URL/admin/feature-flags;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/users {
        proxy_pass $AUB_SERVICE_URL/admin/users;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/user-stats {
        proxy_pass $AUB_SERVICE_URL/admin/user-stats;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/orders {
        proxy_pass $AUB_SERVICE_URL/admin/orders;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/plans {
        proxy_pass $AUB_SERVICE_URL/admin/plans;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/ops {
        proxy_pass $CORE_SERVICE_URL/admin/ops;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/entitlements {
        proxy_pass $CORE_SERVICE_URL/admin/entitlements;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/planner {
        proxy_pass $CORE_SERVICE_URL/admin/planner;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/admin/coupons {
        proxy_pass $AUB_SERVICE_URL/admin/coupons;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    location /api/guests {
        proxy_pass $CORE_SERVICE_URL/guests;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    
    location /api/guest-imports {
        proxy_pass $CORE_SERVICE_URL/guest-imports;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    location /api/campaigns {
        proxy_pass $CORE_SERVICE_URL/campaigns;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Presigned S3 upload URLs (core-service) - used by the invitation studio
    location /api/uploads {
        proxy_pass $CORE_SERVICE_URL/uploads;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Team / membership management (core-service)
    location /api/members {
        proxy_pass $CORE_SERVICE_URL/members;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    location /api/webhook {
        proxy_pass $WEBHOOK_HANDLER_URL;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Plan -> feature entitlements matrix (public, core-service)
    location /api/catalog {
        proxy_pass $CORE_SERVICE_URL/catalog;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }
    location /api/entitlements {
        proxy_pass $CORE_SERVICE_URL/entitlements;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Public web invitation + open-form RSVP (public, core-service)
    # RSVP submission - the abuse-sensitive write. Tight limit: a real guest
    # submits once, so 1 r/s with a burst of 10 is invisible to humans and stops
    # a script filling a paid event's capacity.
    location ~ ^/api/public/invite/[^/]+/rsvp$ {
        limit_req zone=public_write burst=10 nodelay;
        limit_conn perip 20;
        proxy_pass $CORE_SERVICE_URL;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Public invitation reads + the token-authorised prefill lookup. Also the
    # brute-force surface for invite tokens, hence a bounded rate.
    location /api/public {
        limit_req zone=public_read burst=60 nodelay;
        limit_conn perip 20;
        proxy_pass $CORE_SERVICE_URL/public;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Admin-only Messaging catalog publishing API (core-service). Secured by the
    # AuthMiddleware JWT + admin role. Reached at /api/admin/messaging/*.
    location /api/admin/messaging {
        proxy_pass $CORE_SERVICE_URL/admin/messaging;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    }

    # Frontend - must come after API routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files ${DOLLAR}uri ${DOLLAR}uri/ /index.html;
    }

}
