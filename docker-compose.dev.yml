# ---------------------------------------------------------------------------
# Shared service defaults (YAML anchors, merged with `<<:`).
#   restart: unless-stopped  - survive crashes + host reboots (review 2.2/5.7)
#   json-file log rotation   - 10MB x 3 per container, so logs cannot fill disk
# Only nginx publishes a host port. Postgres / Redis / RabbitMQ and every
# backend are reachable on the compose network only; for debugging use
# `docker compose exec <svc> ...` (or an SSH tunnel to the container IP).
# ---------------------------------------------------------------------------
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Cheap HTTP liveness probe for the Python/FastAPI services (no curl/wget in
# python:slim images, so use the stdlib). Pass the URL via the service's
# healthcheck `test`.
x-healthcheck-timing: &hc-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:

  nginx:
    <<: *defaults
    image: nginx:alpine
    ports:
      # The ONLY published port. cloudflared runs on the host and connects to
      # it; set NGINX_BIND_ADDR=127.0.0.1 once you have confirmed the tunnel
      # targets localhost, so nginx is not reachable from the LAN/internet
      # directly (direct access could spoof CF-Connecting-IP).
      - ${NGINX_BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80
    environment:
      - CORE_SERVICE_URL=${BACKEND_PROTOCOL}://${CORE_SERVICE_HOST}:${CORE_SERVICE_PORT}
      - AUB_SERVICE_URL=${BACKEND_PROTOCOL}://${AUB_SERVICE_HOST}:${AUB_SERVICE_PORT}
      - WEBHOOK_HANDLER_URL=${BACKEND_PROTOCOL}://${WEBHOOK_HANDLER_HOST}:${WEBHOOK_HANDLER_PORT}/
      - FRONTEND_DEV_URL=http://frontend-dev:3000
      # dev    = proxy the SPA to the React dev server (frontend-dev) - default.
      # static = serve the production build from ./frontend/build
      #          (nginx/conf.d/default.conf). Switch: build the frontend to
      #          ./frontend/build, set NGINX_MODE=static in .env, recreate nginx,
      #          then `docker compose -f docker-compose.dev.yml stop frontend-dev`.
      - NGINX_MODE=${NGINX_MODE:-dev}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/showup:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /etc/nginx/snippets
        cp /etc/nginx/showup/snippets/*.conf /etc/nginx/snippets/
        envsubst '$$CORE_SERVICE_URL $$AUB_SERVICE_URL $$WEBHOOK_HANDLER_URL' \
          < /etc/nginx/showup/snippets/api_locations.conf.template > /etc/nginx/snippets/api_locations.conf
        if [ "$$NGINX_MODE" = "static" ]; then site=default.conf; else site=dev.conf; fi
        echo "nginx mode: $$NGINX_MODE ($$site)"
        envsubst '$$FRONTEND_DEV_URL' < /etc/nginx/showup/conf.d/$$site > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      <<: *hc-timing
    depends_on:
      frontend-dev:
        condition: service_started
        required: false   # only present with --profile dev (NGINX_MODE=dev)
      aub-service:
        condition: service_started
      core-service:
        condition: service_started
      webhook-hendler:
        condition: service_started

  frontend-dev:
    <<: *defaults
    # Hot-reload dev server. Production serves ./frontend/build (NGINX_MODE=static);
    # start this only for local UI work: docker compose -f docker-compose.dev.yml --profile dev up -d frontend-dev
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # Loopback only - the public path is Cloudflare -> nginx -> frontend-dev.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_SENTRY_DSN=${REACT_APP_SENTRY_DSN:-}
      - REACT_APP_SENTRY_ENVIRONMENT=${REACT_APP_SENTRY_ENVIRONMENT:-development}
      - REACT_APP_SENTRY_RELEASE=${REACT_APP_SENTRY_RELEASE:-}
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # HMR client must connect through the proxy (443), not the dev server's
      # internal port 3000 which isn't exposed via Cloudflare/nginx.
      - WDS_SOCKET_PORT=0
      - REACT_APP_API_URL=http://localhost:${HTTP_PORT}
      - REACT_APP_GOOGLE_PLACES_API_KEY=${REACT_APP_GOOGLE_PLACES_API_KEY}
      - REACT_APP_TAX_RATE=${REACT_APP_TAX_RATE:-0.18}
    stdin_open: true
    tty: true

  postgres:
    <<: *defaults
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *defaults
    image: rabbitmq:3-management
    # Fixed hostname: RabbitMQ keys its data dir by node name (rabbit@<hostname>);
    # a random container hostname would orphan the volume on every recreate.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      # Durable queues survive recreate/deploy (review 2.10).
      - rabbitmqdata:/var/lib/rabbitmq

  redis:
    <<: *defaults
    image: redis:alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Auth required when REDIS_PASSWORD is set (it MUST be in production);
    # AOF persistence so OTP/rate-limit/batching state survives a restart.
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then set -- --requirepass "$$REDIS_PASSWORD"; fi
        exec redis-server --appendonly yes "$$@"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    <<: *defaults
    build:
      context: .
      dockerfile: core-service/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - PORT=${CORE_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - OUTPOST_PRIORITY_QUEUE=${OUTPOST_PRIORITY_QUEUE:-outpost_priority_queue}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CAMPAIGN_MIN_GAP_MINUTES=${CAMPAIGN_MIN_GAP_MINUTES}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # Upload hardening (image-only): per-file cap + per-event object quota.
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-10485760}
      - UPLOAD_MAX_PER_EVENT=${UPLOAD_MAX_PER_EVENT:-30}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      - AUB_SERVICE_URL=${BACKEND_PROTOCOL}://${AUB_SERVICE_HOST}:${AUB_SERVICE_PORT}
      # Shared secret for core<->aub internal calls (member lookup, venue owner
      # provisioning + welcome, partner-coupon lookup). Without it every internal
      # call is rejected 403 and the B2B2C flow silently degrades.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      # Meta WhatsApp template MANAGEMENT (Admin publishing API). WA_WABA_ID is the
      # WhatsApp Business Account id; absent creds => safe simulation mode.
      - WA_API_B=${WA_API_B:-}
      - WA_WABA_ID=${WA_WABA_ID:-}
      - WA_APP_ID=${WA_APP_ID:-}
      - WA_GRAPH_VERSION=${WA_GRAPH_VERSION:-v22.0}
      # Used by the Admin preview endpoint to resolve image/link variables.
      - MEDIA_S3_URL=${MEDIA_S3_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # AI event assistant (POST /assistant). Absent key => 503 with a clear message.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-gpt-4o-mini}
      # Paid extra-round price bands [[max_recipients, price],…] (null = "and above").
      - EXTRA_ROUND_PRICES_JSON=${EXTRA_ROUND_PRICES_JSON:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${CORE_SERVICE_PORT}/healthz', timeout=4)"]
      <<: *hc-timing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  aub-service:
    <<: *defaults
    build:
      context: .
      dockerfile: aub-service/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - PORT=${AUB_SERVICE_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - ICOUNT_IPN_SECRET=${ICOUNT_IPN_SECRET:-}
      # Per-phone OTP budgets (defaults shown; enforced in aub via Redis).
      - OTP_MAX_ISSUES_PER_HOUR=${OTP_MAX_ISSUES_PER_HOUR:-5}
      - OTP_MAX_ISSUES_PER_DAY=${OTP_MAX_ISSUES_PER_DAY:-10}
      - OTP_MAX_FAILED_VERIFIES=${OTP_MAX_FAILED_VERIFIES:-10}
      - JWT_EXP_SECONDS=${JWT_EXP_SECONDS}
      - OTP_TTL_SEC=${OTP_TTL_SEC}
      - OTP_QUEUE_NAME=${OTP_QUEUE_NAME}
      # Outbound WhatsApp queue (venue welcome message publishes here).
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - CORE_SERVICE_URL=${BACKEND_PROTOCOL}://${CORE_SERVICE_HOST}:${CORE_SERVICE_PORT}
      # iCount PayPage payments - set ICOUNT_API_TOKEN in .env to enable.
      - ICOUNT_BASE_URL=${ICOUNT_BASE_URL:-}
      - ICOUNT_API_TOKEN=${ICOUNT_API_TOKEN:-}
      # PayPages by PURCHASE TYPE (new purchase supports coupons; upgrade is credit-
      # only). ICOUNT_PAYPAGE_ID is the legacy single-PayPage fallback for both.
      - ICOUNT_NEW_PURCHASE_PAYPAGE_ID=${ICOUNT_NEW_PURCHASE_PAYPAGE_ID:-}
      - ICOUNT_UPGRADE_PAYPAGE_ID=${ICOUNT_UPGRADE_PAYPAGE_ID:-}
      - ICOUNT_PAYPAGE_ID=${ICOUNT_PAYPAGE_ID:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Customer-facing app origin for links in the venue welcome message
      # (falls back to PUBLIC_BASE_URL when unset).
      - APP_BASE_URL=${APP_BASE_URL:-}
      # VAT rate (fraction) for the before-VAT price breakdown. Default 0.18.
      - TAX_RATE=${TAX_RATE:-0.18}
      # Coupon catalogue as JSON, e.g. {"WELCOME10":{"type":"percent","value":10}}. Empty = coupons disabled.
      - COUPONS_JSON=${COUPONS_JSON:-}
      # B2B2C: default venue partner coupon (used when a venue has no per-venue
      # code). Must be a key in COUPONS_JSON to actually apply a discount.
      - DEFAULT_VENUE_COUPON=${DEFAULT_VENUE_COUPON:-}
      # Optional approved Meta template for the venue welcome (first-contact
      # business-initiated messages require a template). Falls back to free_text.
      - WA_VENUE_WELCOME_TEMPLATE=${WA_VENUE_WELCOME_TEMPLATE:-}
      # Approved MARKETING template sent by the landing-page WhatsApp demo button.
      - WA_DEMO_TEMPLATE_NAME=${WA_DEMO_TEMPLATE_NAME:-showup_whatsapp_demo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AUB_SERVICE_PORT}/healthz', timeout=4)"]
      <<: *hc-timing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
  outpost-service:
    <<: *defaults
    build:
      context: .
      dockerfile: outpost-service/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - WA_API_B=${WA_API_B}
      - WA_PHONE_ID=${WA_PHONE_ID}
      - CAMPAIGN_WA_PHONE_ID=${CAMPAIGN_WA_PHONE_ID:-}
      - ASSISTANT_WA_PHONE_ID=${ASSISTANT_WA_PHONE_ID:-}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - OUTPOST_ENABLE_DB_LOGGING=true
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy

  schedule-service:
    <<: *defaults
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - PORT=${SCHEDUALE_SERVICE_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - CAMPAIGNS_QUEUE=${CAMPAIGNS_QUEUE}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - DAILY_SUMMARY_HOUR=${DAILY_SUMMARY_HOUR:-20}
      - DAILY_SUMMARY_MINUTE=${DAILY_SUMMARY_MINUTE:-0}
      - DAILY_SUMMARY_TZ=${DAILY_SUMMARY_TZ:-Asia/Jerusalem}
      - WA_DAILY_SUMMARY_TEMPLATE_NAME=${WA_DAILY_SUMMARY_TEMPLATE_NAME:-}
      - WA_DAILY_SUMMARY_LANG=${WA_DAILY_SUMMARY_LANG:-he}
      # Payment reconciliation: recovers orders whose iCount IPN was lost.
      - AUB_SERVICE_URL=${AUB_SERVICE_URL:-http://aub-service:8000}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - PAYMENT_RECONCILE_INTERVAL_SECONDS=${PAYMENT_RECONCILE_INTERVAL_SECONDS:-300}
      - PAYMENT_RECONCILE_MIN_AGE_MINUTES=${PAYMENT_RECONCILE_MIN_AGE_MINUTES:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SCHEDUALE_SERVICE_PORT}/healthz', timeout=4)"]
      <<: *hc-timing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # Global Delivery Planner - owns delivery timing across all events (see prod compose).
  planner-service:
    <<: *defaults
    build:
      context: .
      dockerfile: planner-service/Dockerfile
    environment:
      - WA_API_B=${WA_API_B}
      - CAMPAIGN_WA_PHONE_ID=${CAMPAIGN_WA_PHONE_ID}
      - WA_PHONE_ID=${WA_PHONE_ID}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - PORT=${PLANNER_SERVICE_PORT:-5010}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - META_MESSAGES_PER_SECOND=${META_MESSAGES_PER_SECOND:-80}
      - META_NEW_CONVERSATIONS_PER_24H=${META_NEW_CONVERSATIONS_PER_24H:-1000}
      - META_TIER=${META_TIER:-TIER_1K}
      - META_QUALITY_RATING=${META_QUALITY_RATING:-GREEN}
      - PLANNER_SAFETY_MARGIN_PERCENT=${PLANNER_SAFETY_MARGIN_PERCENT:-15}
      - MAX_EARLY_SEND_DAYS=${MAX_EARLY_SEND_DAYS:-5}
      - MAX_LATE_SEND_DAYS=${MAX_LATE_SEND_DAYS:-2}
      - PLANNER_INTERVAL_SECONDS=${PLANNER_INTERVAL_SECONDS:-20}
      - PLANNER_STRATEGY=${PLANNER_STRATEGY:-deterministic}
      - PLANNER_HORIZON_DAYS=${PLANNER_HORIZON_DAYS:-60}
      - PLANNER_FLEXIBILITY_JSON=${PLANNER_FLEXIBILITY_JSON:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PLANNER_SERVICE_PORT:-5010}/healthz', timeout=4)"]
      <<: *hc-timing
    depends_on:
      postgres:
        condition: service_healthy

  campaign-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: campaign-worker/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - CAMPAIGNS_QUEUE=${CAMPAIGNS_QUEUE}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - MEDIA_S3_URL=${MEDIA_S3_URL}
      # Public app origin for invitation/RSVP links resolved at send time.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  otp-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: otp-worker/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - OTP_QUEUE_NAME=${OTP_QUEUE_NAME}
      # OTP is delivered over WhatsApp via the approved "otp" authentication template.
      - WA_API_B=${WA_API_B}
      - WA_PHONE_ID=${WA_PHONE_ID}
      - OTP_WA_PHONE_ID=${OTP_WA_PHONE_ID:-}
      - WA_OTP_TEMPLATE_NAME=${WA_OTP_TEMPLATE_NAME:-otp}
      - WA_OTP_LANG=${WA_OTP_LANG:-he}
    depends_on:
      rabbitmq:
        condition: service_started

  webhook-hendler:
    <<: *defaults
    build:
      context: .
      dockerfile: webhook-hendler/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - PORT=${WEBHOOK_HANDLER_PORT}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@${REDIS_HOST}:${REDIS_PORT}/0
      - WEBHOOK_QUEUE=${WEBHOOK_QUEUE_NAME}
      - CONTACT_IMPORT_QUEUE=${CONTACT_IMPORT_QUEUE}
      # Inbound routing by receiving business number (per-handler phone split).
      - ASSISTANT_WA_PHONE_ID=${ASSISTANT_WA_PHONE_ID:-}
      - OTP_WA_PHONE_ID=${OTP_WA_PHONE_ID:-}
      - ASSISTANT_INBOUND_QUEUE=${ASSISTANT_INBOUND_QUEUE:-assistant_inbound_queue}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WEBHOOK_HANDLER_PORT}/health', timeout=4)"]
      <<: *hc-timing
    depends_on:
      rabbitmq:
        condition: service_started

  contact-import-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: contact-import-worker/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - CONTACT_IMPORT_QUEUE=${CONTACT_IMPORT_QUEUE}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@${REDIS_HOST}:${REDIS_PORT}/0
      # Debounce window for multi-contact shares (seconds).
      - CONTACT_BATCH_WINDOW_SECONDS=${CONTACT_BATCH_WINDOW_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy

  # Owner-facing WhatsApp AI assistant: consumes messages that arrived on the
  # assistant business number, authorizes by sender phone (event owners only)
  # and answers via core-service POST /assistant.
  assistant-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: assistant-worker/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      # Long assistant calls run inside the consumer callback; a generous
      # heartbeat keeps the AMQP connection alive meanwhile.
      - RABBITMQ_HEARTBEAT=300
      - ASSISTANT_INBOUND_QUEUE=${ASSISTANT_INBOUND_QUEUE:-assistant_inbound_queue}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - CONTACT_IMPORT_QUEUE=${CONTACT_IMPORT_QUEUE}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@${REDIS_HOST}:${REDIS_PORT}/0
      - CORE_SERVICE_URL=${BACKEND_PROTOCOL}://${CORE_SERVICE_HOST}:${CORE_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      core-service:
        condition: service_started

  webhook-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: webhook-worker/Dockerfile
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - WEBHOOK_QUEUE=${WEBHOOK_QUEUE_NAME}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - CONVERSATION_INITIAL_STATE=${CONVERSATION_INITIAL_STATE}
      - SECONDARY_BOT_PHONE=${SECONDARY_BOT_PHONE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      core-service:
        condition: service_started

networks:
  default:
    driver: bridge
volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
