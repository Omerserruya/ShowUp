# webhook-worker/messages.yaml
# מגדיר את ההודעות והטמפלייטים שנשלחים למשתמשים

rsvp_invite:
  type: template
  template_name: "event_no_pic"
  language: he
  parameters:
    - "{{event.name}}"
    - "{{event.inviters}}"
    - "{{event.date}}"
    - "{{event.date}}"
    - "{{event.location}}"
    - "{{guest.name}}"
  buttons:
    - title: ״ברור שאני בא!״
      payload:  "ברור שאני בא!"
    - title: "לצערי לא אוכל להגיע ):"
      payload: "לצערי לא אוכל להגיע ):"
    - title: "עוד מתלבט, תחזרו אלי?"
      payload: "עוד מתלבט, תחזרו אלי?"

rsvp_count:
  type: text
  text: "יופי! שמחים לדעת שתוכל להגיע ל{{event.name}} של {{event.inviters}} 🥳\nרק כדי שנוכל להתכונן כמו שצריך – כמה אנשים יגיעו איתך? 😊\n הגב בבקשה במספר בלבד"

rsvp_info_question:
  type: interactive
  text: "תודה על העדכון! האם יש משהו שחשוב שנדע? למשל מנה צמחונית/טבעונית או כל הערה מיוחדת – נשמח אם תעדכן כאן ❤️"
  buttons:
    - type: reply
      title: "אין שום דבר מיוחד"
      payload: "אין שום דבר מיוחד"
    - type: reply
      title: "לכתוב לנו הערה"
      payload: "לכתוב לנו הערה"

note_info:
  type: text
  text: "בוודאי 😊 נשמח אם תכתוב לנו את ההערה כאן 👇"

rsvp_done:
  type: interactive
  text: "מעולה! רשמנו לפנינו שתגיעו ✨  \nאם יהיו שינויים, נשמח אם תעדכן כאן או תענה על ההודעה ❤️"
  buttons:
    - type: reply
      title: "לעדכן הגעה"
      payload: "לעדכן הגעה"

rsvp_update:
  type: interactive
  text: "נשמח אם תעדכן אותנו מה השתנה לגבי ההגעה שלך ✨  \nאפשר לעדכן את הפרטים דרך הכפתור למטה ❤️"
  buttons:
    - type: reply
      title: "יש הערה שלא ציינו"
      payload: "יש הערה שלא ציינו"
    - type: reply
      title: "בסוף לא נוכל להגיע"
      payload: "בסוף לא נוכל להגיע"
    - type: reply
      title: "נגיע כמות אחרת משציפינו"
      payload: "נגיע כמות אחרת משציפינו"

rsvp_decline:
  type: interactive
  text: "חבל {{guest.name}} 😢 עדכנו שלא תגיע. אם תתחרט תמיד אפשר לכתוב לנו שוב!"
  buttons:
    - type: reply
      title: "לעדכן הגעה"
      payload: "לעדכן הגעה"

didnt_understand:
  type: text
  text: "לא כל כך הבנו את התשובה 😅 נסה לבחור אחת מהאפשרויות למעלה או כתוב 'עזרה'."

# Example interactive message with both reply and URL buttons
rsvp_invite_interactive:
  type: interactive
  text: "היי {{guest.name}}! שמחים להזמינך ל{{event.name}} 🎉"
  buttons:
    - type: reply
      title: "כן, אני מגיע 🎉"
      payload: "כן, אני מגיע 🎉"
    - type: reply
      title: "לא אוכל להגיע 😢"
      payload: "לא אוכל להגיע 😢"
    - type: url
      title: "פרטי האירוע 🌍"
      url: "https://showup.events/{{event.id}}"
