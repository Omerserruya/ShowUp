# Upstream headers for every proxied /api location (static - not envsubst'd).
# $remote_addr is already the real visitor IP (real_ip module, nginx.conf), so
# X-Forwarded-For carries ONE trusted value instead of appending whatever the
# client sent.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
