# DEV / interim mode (NGINX_MODE=dev, the default): the SPA is served by the
# React dev server (frontend-dev). envsubst template - only $FRONTEND_DEV_URL
# (plus the backend URLs in the included API snippet) are substituted.
server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/security_headers.conf;

    # All /api/* routes (shared with default.conf) - must come before "/".
    include /etc/nginx/snippets/api_locations.conf;

    # Container healthcheck (docker compose) - never proxied, never logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # WebSocket support for React dev server hot reload
    location /sockjs-node {
        proxy_pass $FRONTEND_DEV_URL;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Frontend dev server - proxy all requests to React dev server
    location / {
        proxy_pass $FRONTEND_DEV_URL;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Dev bundles are NOT content-hashed (bundle.js), so any CDN/browser
        # caching serves stale code. Tell Cloudflare + the browser never to
        # cache the dev frontend. (Cloudflare respects no-store for static assets.)
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # add_header above disables inheritance - re-apply security headers.
        include /etc/nginx/snippets/security_headers.conf;

        # Increase timeouts for dev server
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
