# webhook-worker/conversation_flow.yaml
rsvp_invite:
  next:
    "ברור שאני בא!": rsvp_count
    "לצערי לא אוכל להגיע ):": rsvp_decline
    "עוד מתלבט, תחזרו אלי?": rsvp_decline

rsvp_count:
  next:
    "*": rsvp_info_question

rsvp_info_question:
  next:
    "אין שום דבר מיוחד": rsvp_done
    "לכתוב לנו הערה": note_info

note_info:
  next:
    "*": rsvp_done

rsvp_done:
  next:
    "לעדכן הגעה": rsvp_update

rsvp_update:
  next:
    "יש הערה שלא ציינו": note_info
    "בסוף לא נוכל להגיע": rsvp_decline
    "נגיע כמות אחרת בסוף": rsvp_count

# rsvp_decline is a terminal state, but allow users to restart if they change their mind
rsvp_decline:
  next:
    "*": rsvp_update  # Allow any input to restart the flow

# מיפוי סטטוס לפי state
state_status_mapping:
  rsvp_thank_you: attending
  rsvp_decline: declined
  rsvp_no_food: attending
