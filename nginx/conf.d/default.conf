# PRODUCTION mode (NGINX_MODE=static): the SPA is the static React build
# (./frontend/build mounted at /usr/share/nginx/html). envsubst template - the
# backend URLs in the included API snippet are the only substitutions.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security_headers.conf;

    # All /api/* routes (shared with dev.conf) - must come before "/".
    include /etc/nginx/snippets/api_locations.conf;

    # Container healthcheck (docker compose) - never proxied, never logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Content-hashed bundles (main.<hash>.js, <hash>.chunk.css, media) -
    # safe to cache for a year; a new build changes every filename.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated, otherwise users keep loading
    # an index.html that points at bundles a deploy has already replaced.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    # Source maps are not built (GENERATE_SOURCEMAP=false); refuse stragglers.
    location ~ \.map$ {
        return 404;
    }

    # SPA: real files are served as-is, every other path is a client route.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
}
