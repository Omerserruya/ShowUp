user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not advertise the nginx version in headers / error pages.
    server_tokens off;

    # ---- Real client address -----------------------------------------------
    # Traffic path: browser -> Cloudflare edge -> cloudflared (host process) ->
    # docker-proxy -> nginx:80. The TCP peer nginx sees is therefore the docker
    # gateway / loopback, never the visitor. Cloudflare puts the visitor IP in
    # CF-Connecting-IP; we trust that header ONLY when the peer is one of the
    # local/docker ranges below, and rewrite $remote_addr from it. Every rate
    # limit zone is keyed on $binary_remote_addr AFTER this rewrite.
    #
    # NOTE: a client that can reach nginx:80 directly from one of these ranges
    # could spoof CF-Connecting-IP. Keep port 80 unreachable from the internet
    # (bind it to 127.0.0.1 via NGINX_BIND_ADDR, or firewall it) so the only
    # way in is the tunnel.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" peer=$realip_remote_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Uploads: guest Excel/CSV imports and invitation images go through core.
    # The 1MB default broke larger guest-list imports (review 5.14).
    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml application/manifest+json;

    # WebSocket support for hot reload (used in dev.conf)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Scheme the visitor actually used. Behind the tunnel nginx itself only
    # speaks http, so $scheme is always "http"; cloudflared forwards the
    # original scheme in X-Forwarded-Proto.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    # ---- Rate limiting -----------------------------------------------------
    # All zones keyed on the real visitor address (see real_ip above).
    #
    #   public_read   page views + prefill lookups   30 r/s, burst 60
    #   public_write  OTP issue/verify, RSVP, redeem  1 r/s, burst 10
    #   api_general   authenticated API              50 r/s, burst 100 (safety net)
    #   assistant     LLM assistant (costly)         10 r/m, burst 5
    limit_req_zone $binary_remote_addr zone=public_read:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=public_write:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=assistant:10m rate=10r/m;
    # Cap concurrent connections per client as well, so slow-loris style abuse
    # cannot tie up worker slots that legitimate guests need.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # 429 is the correct, cacheable signal; the default 503 reads as "our fault".
    limit_req_status 429;
    limit_conn_status 429;
    # Throttling is expected, not exceptional - keep it out of the error log.
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
