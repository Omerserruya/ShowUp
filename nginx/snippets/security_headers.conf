# Security headers (static - not envsubst'd). Included at server level AND in
# every location that sets its own add_header (nginx drops inherited
# add_header directives as soon as a location declares any of its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The public site is HTTPS-only at the Cloudflare edge.
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP in REPORT-ONLY mode: violations show in the browser console, nothing is
# blocked. Tighten and switch to Content-Security-Policy once the console is
# clean on every page (landing, wizard, studio, payment, public invite, admin).
#   - 'unsafe-inline' styles: MUI/emotion injects <style> tags at runtime.
#   - *.amazonaws.com: S3 presigned POST uploads + invitation/media images.
#   - *.ingest*.sentry.io: frontend error reporting.
#   - maps.googleapis.com / maps.gstatic.com: Google Places autocomplete.
#   - frame-src: iCount PayPage / Google Maps embeds if used.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://*.icount.co.il; script-src 'self' https://maps.googleapis.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.amazonaws.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com; connect-src 'self' https://cloudflareinsights.com https://*.amazonaws.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://maps.googleapis.com https://places.googleapis.com; frame-src 'self' https://*.icount.co.il https://www.google.com https://maps.google.com; worker-src 'self' blob:; manifest-src 'self'" always;
