# ============================================================================
# ShowUp - Messaging Content Catalog (the CONTENT REPOSITORY for all copy)
#
# Hierarchy:  Stage -> Event Type -> Variant -> WhatsApp Template
#
# AUTHOR EVENT TYPES FIRST. Each event type OWNS its own copy: Wedding, Brit,
# Brita, Bar, Bat, Birthday, Corporate and Other each carry their full variant
# set under `variants:`. To write copy you go Stage -> Event Type -> Variant and
# edit - you never think about inheritance.
#
#   * event_types.<type>   - the real event types. Each owns its variants and
#                            template copy. `default_variant` = the recommended
#                            variant for that (stage x event type).
#   * event_types._shared  - TECHNICAL FALLBACK ONLY. Not the place to author
#                            production copy. An event type falls back here only
#                            if it intentionally has NO variant of its own. It
#                            also holds today's 6 active deliverable anchors.
#   * availability         - which stages are recommended per event type
#                            (true / optional / false). A default, not a lock.
#
# Reuse later: if two event types end up with identical messaging, move that copy
# into `_shared` and delete the per-type variant. Author first, reuse later.
#
# variables are auto-derived from the copy + Meta binding; preview is UI-only;
# metadata is editing/publishing only. MUTABLE Meta runtime state lives in the DB
# (`messaging_template_state`). Loader + inheritance: catalog.py; guards: validation.py.
# ============================================================================
