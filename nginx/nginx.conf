user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    # WebSocket support for hot reload (used in dev.conf)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ---- Rate limiting -----------------------------------------------------
    # The public invitation endpoints are unauthenticated by design, so they are
    # the one surface an anonymous attacker can hammer: brute-forcing invite
    # tokens, or mass-submitting RSVPs to exhaust an event's paid guest capacity.
    #
    # Zones are keyed on the ORIGINAL client address ($clientaddr, mapped below)
    # so a proxy in front of nginx cannot collapse every visitor into one bucket.
    # Limits are deliberately generous relative to human behaviour: a guest opens
    # an invitation and submits once, so even a large family sharing a phone hotspot
    # stays far below them, while a script is throttled within a second.
    #
    #   public_read   page views + prefill lookups   30 r/s, burst 60
    #   public_write  RSVP submissions                1 r/s, burst 10
    #   api_general   authenticated API              50 r/s, burst 100 (safety net)
    map $http_x_forwarded_for $clientaddr {
        # Take the first hop in X-Forwarded-For when present, else the peer address.
        default          $remote_addr;
        ~^(?P<first>[^,\s]+) $first;
    }
    limit_req_zone $clientaddr zone=public_read:10m rate=30r/s;
    limit_req_zone $clientaddr zone=public_write:10m rate=1r/s;
    limit_req_zone $clientaddr zone=api_general:10m rate=50r/s;
    # Cap concurrent connections per client as well, so slow-loris style abuse
    # cannot tie up worker slots that legitimate guests need.
    limit_conn_zone $clientaddr zone=perip:10m;
    # 429 is the correct, cacheable signal; the default 503 reads as "our fault".
    limit_req_status 429;
    limit_conn_status 429;
    # Throttling is expected, not exceptional - keep it out of the error log.
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}