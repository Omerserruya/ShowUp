  #     - ${CORE_SERVICE_PORT}:5000
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_PORT=${DB_PORT}
  #     - DB_USER=${DB_USER}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_NAME=${DB_NAME}
  #     - RABBITMQ_HOST=rabbitmq
  #     - RABBITMQ_PORT=${RABBITMQ_PORT}
  #     - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
  #     - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
  #   depends_on:
  #     - postgres
  #     - rabbitmq

  # aub-service:
  aub-service:
    build:
      context: ./aub-service
      dockerfile: Dockerfile
    ports:
      - ${AUB_SERVICE_PORT}:5001
    environment:
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - OUTPOST_QUEUE_NAME=${OUTPOST_QUEUE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - OTP_TTL_SEC=${OTP_TTL_SEC}
    depends_on:
      - postgres
      - rabbitmq

